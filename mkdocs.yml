site_name: Proyectos · Javiera González Mardones
site_url: https://zelaznog-j.github.io/proyectos/
site_dir: proyectos

theme:
  name: material
  language: es
  font:
    text: Manrope
  palette:
    primary: custom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables

plugins:
  - search
  - mkdocs-jupyter:
      ignore_h1_titles: true

nav:
  - Portafolio: https://zelaznog-j.github.io/
  - Inicio: index.md
  - Precipitación en Chile (ERA5):
      - Resumen: precipitacion-era5/index.md
      - Notebook completo: precipitacion-era5/notebook.ipynb
  # - Límites administrativos (Overture): overture.ipynb
